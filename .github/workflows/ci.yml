name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.build-system }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Swift 6.4+ defaults to swiftbuild, older toolchains to native; the two
        # lay out .build differently, so both must stay green.
        build-system: [native, swiftbuild]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build release configuration
        run: swift build --configuration release --build-system ${{ matrix.build-system }}

      - name: Run tests
        run: swift test --build-system ${{ matrix.build-system }}
